# pyproject.toml
[project]
name = "fastx32shell"
version = "0.1.0"
description = "FastX 3 replay tooling"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
fastx32shell = "fastx32shell.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastx32shell"]
